<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrap Heap — Live Cluster</title>
  <link rel="stylesheet" href="/dash.css">
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <section class="brand">
        <div class="brand-title">SCRAP HEAP <span>LIVE CLUSTER</span></div>
        <div class="join-card">
          <img id="join-qr" src="/qr.png" alt="Scan to join the compute cluster">
          <div>
            <div class="eyebrow">SCAN TO CONTRIBUTE</div>
            <a id="join-url" href="#" target="_blank" rel="noopener">Loading join URL…</a>
          </div>
        </div>
      </section>

      <section class="headline-stats" aria-label="Cluster status">
        <div class="hero-rate">
          <div class="eyebrow">TILES / SEC</div>
          <div id="tiles-per-sec" class="rate-value">-</div>
        </div>
        <div class="stat-block">
          <div class="eyebrow">DEVICES</div>
          <div id="device-count" class="stat-value">-</div>
        </div>
        <div class="stat-block progress-stat">
          <div class="eyebrow">COMPLETED</div>
          <div id="done-total" class="stat-value">- / -</div>
          <div class="progress-track"><div id="progress-fill"></div></div>
        </div>
        <div id="verified-badge" class="verified-badge">Verified: - / -</div>
        <div class="connection-state">
          <span id="connection-dot"></span>
          <span id="connection-label">disconnected</span>
        </div>
      </section>

      <nav class="actions" aria-label="Dashboard actions">
        <a class="action-button" href="/api/export.csv">Export CSV</a>
        <button id="run-again" class="action-button primary" type="button">Run again</button>
        <button id="run-baseline" class="action-button secondary" type="button">Run baseline B</button>
      </nav>
    </header>

    <section class="workspace">
      <section class="visual-column">
        <div class="section-heading">
          <div>
            <span class="eyebrow">MANDELBROT / 2048 × 2048</span>
            <h1>Live render</h1>
          </div>
          <button id="tint-toggle" class="toggle-button" type="button" aria-pressed="false">
            <span id="tint-indicator"></span> Device tint <kbd>T</kbd>
          </button>
        </div>
        <div class="image-frame">
          <canvas id="image-canvas" width="2048" height="2048" aria-label="Live Mandelbrot tile render"></canvas>
          <div id="tile-tooltip" class="tile-tooltip" hidden></div>
        </div>
        <div id="device-legend" class="device-legend"></div>
      </section>

      <aside class="side-column">
        <section class="chart-panel">
          <div class="section-heading compact">
            <div>
              <div class="eyebrow">ROLLING 60 SECONDS</div>
              <h2>Throughput</h2>
            </div>
          </div>
          <canvas id="rate-chart" aria-label="Tiles per second over the last 60 seconds"></canvas>
        </section>

        <section class="devices-panel">
          <div class="section-heading compact">
            <div>
              <div class="eyebrow">WORKERS</div>
              <h2>Devices</h2>
            </div>
          </div>
          <div id="device-list" class="device-list"></div>
        </section>

        <section class="events-panel">
          <div class="section-heading compact">
            <div>
              <div class="eyebrow">LIVE ACTIVITY</div>
              <h2>Event ticker</h2>
            </div>
          </div>
          <ol id="event-list" class="event-list"></ol>
        </section>
      </aside>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <pre id="debug-overlay" class="debug-overlay" hidden></pre>
  </main>
  <script src="/dash.js"></script>
</body>
</html>
